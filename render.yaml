# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Configured for the FREE tier: a database and a web service, no worker.
#
# Render has no free worker plan, so the worker is commented out at the bottom
# of this file. Nothing schedules itself on this configuration — no deadline is
# checked, no alert fires, no notification is delivered and YouTube never syncs
# until something calls the cron endpoints. Point a free external scheduler at
# them; see docs/DEPLOYMENT.md section 5.
#
# Before real student data: uncomment the worker, move academy-db off "free"
# (Render DELETES free databases after 30 days), and move the web service off
# "free" so it stops sleeping after 15 minutes idle.

databases:
  - name: academy-db
    databaseName: academy
    user: academy
    # The free Postgres plan is deleted by Render after 30 days. Move to
    # "basic-256mb" or larger before you put real student data in it.
    plan: free

services:
  - type: web
    name: academy-web
    runtime: python
    plan: free
    # collectstatic runs here so the compressed manifest is baked into the
    # image rather than rebuilt on every boot.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # Free instances have no shell and no pre-deploy hook, so migrations and the
    # first admin account have to happen here. Both commands are idempotent.
    startCommand: "python manage.py migrate --noinput && python manage.py bootstrap_admin && python manage.py setup_schedules && gunicorn config.wsgi:application --workers 3 --timeout 120 --access-logfile -"
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: academy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Must be exactly 32 random bytes, base64 encoded, so Render cannot
      # generate it. Paste your own; see docs/DEPLOYMENT.md section 1.
      # Losing or changing it invalidates every stored OAuth token and TOTP
      # secret, so keep a copy in a password manager.
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      # Set both of these to your actual Render URL after the first deploy,
      # e.g. academy-web.onrender.com. A mismatch produces a bare 400.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Creates the first Super Admin on boot, because a free instance has no
      # shell to run createsuperuser in. Delete both once the account exists;
      # the command will not overwrite an account that is already there.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: WEB_CONCURRENCY
        value: "3"

