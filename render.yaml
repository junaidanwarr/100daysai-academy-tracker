# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Three resources: a database, the web service, and a worker.
#
# The worker is not optional. Without it nothing is monitored: no research
# deadline is checked, no alert fires, no notification is delivered and YouTube
# never syncs. Render has no free worker tier, so if you are evaluating on the
# free plan, delete the worker below and drive the jobs with an external
# scheduler instead — see docs/DEPLOYMENT.md section 5.

databases:
  - name: academy-db
    databaseName: academy
    user: academy
    # The free Postgres plan is deleted by Render after 30 days. Move to
    # "basic-256mb" or larger before you put real student data in it.
    plan: free

services:
  - type: web
    name: academy-web
    runtime: python
    plan: free
    # collectstatic runs here so the compressed manifest is baked into the
    # image rather than rebuilt on every boot.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --workers 3 --timeout 120 --access-logfile -"
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: academy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Must be exactly 32 random bytes, base64 encoded, so Render cannot
      # generate it. Paste your own; see docs/DEPLOYMENT.md section 1.
      # Losing or changing it invalidates every stored OAuth token and TOTP
      # secret, so keep a copy in a password manager.
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      # Set both of these to your actual Render URL after the first deploy,
      # e.g. academy-web.onrender.com. A mismatch produces a bare 400.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: WEB_CONCURRENCY
        value: "3"

  - type: worker
    name: academy-worker
    runtime: python
    # Render has no free worker plan. This is the cheapest paid tier.
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py qcluster"
    envVars:
      # The worker writes to the same database and decrypts the same tokens,
      # so it needs an identical environment to the web service.
      - key: DATABASE_URL
        fromDatabase:
          name: academy-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: academy-web
          envVarKey: SECRET_KEY
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: academy-web
          envVarKey: CRON_SECRET
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
